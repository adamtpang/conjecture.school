<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .label { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-weight: 400; fill: #8B5A3C; letter-spacing: 4px; }
      .meta  { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-weight: 400; fill: #9A8F84; letter-spacing: 2.5px; }
      .wordmark { font-family: 'Fraunces', Georgia, serif; font-weight: 300; fill: #2B2622; }
      .quote { font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 300; fill: #5C5048; }
      .amp { fill: #8B5A3C; }
      .foot { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-weight: 400; fill: #9A8F84; letter-spacing: 3px; }
    </style>
  </defs>

  <!-- cream bg -->
  <rect width="1200" height="630" fill="#FAF7F2"/>

  <!-- subtle constellation in walnut, low opacity -->
  <g fill="#8B5A3C">
    <circle cx="120" cy="80" r="2.2" opacity="0.30"/>
    <circle cx="280" cy="60" r="1.4" opacity="0.20"/>
    <circle cx="480" cy="100" r="1.8" opacity="0.25"/>
    <circle cx="900" cy="70" r="2.4" opacity="0.30"/>
    <circle cx="1080" cy="100" r="1.6" opacity="0.22"/>
    <circle cx="160" cy="540" r="1.5" opacity="0.20"/>
    <circle cx="340" cy="560" r="2.0" opacity="0.28"/>
    <circle cx="900" cy="560" r="1.8" opacity="0.25"/>
    <!-- ∴ cluster lower right -->
    <circle cx="1040" cy="520" r="2.8" opacity="0.40"/>
    <circle cx="1000" cy="580" r="2.8" opacity="0.40"/>
    <circle cx="1080" cy="580" r="2.8" opacity="0.40"/>
  </g>

  <!-- top label -->
  <text x="600" y="120" text-anchor="middle" class="label" font-size="18">A LECTURE SERIES AT NETWORK SCHOOL</text>

  <!-- hairline -->
  <line x1="540" y1="155" x2="660" y2="155" stroke="#E5DDD2" stroke-width="1"/>

  <!-- wordmark -->
  <text x="600" y="280" text-anchor="middle" class="wordmark" font-size="96">Conjecture <tspan class="amp">&amp;</tspan> Refutations</text>

  <!-- ornament -->
  <g transform="translate(600,335)">
    <line x1="-80" y1="0" x2="-20" y2="0" stroke="#E5DDD2" stroke-width="1"/>
    <text x="0" y="6" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="22" fill="#8B5A3C" opacity="0.7">&#10022;</text>
    <line x1="20" y1="0" x2="80" y2="0" stroke="#E5DDD2" stroke-width="1"/>
  </g>

  <!-- ethos -->
  <text x="600" y="410" text-anchor="middle" class="quote" font-size="34">Every lecture is a conjecture.</text>
  <text x="600" y="458" text-anchor="middle" class="quote" font-size="34">Every conjecture is open to refutation.</text>

  <!-- footer -->
  <text x="600" y="565" text-anchor="middle" class="foot" font-size="14">CONJECTURE.SCHOOL</text>
</svg>
